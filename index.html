<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Zoe's Work Board</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Familjen+Grotesk:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: a "do first" strip on top, then one stacked band per project in priority order, tasks grouped by workstream. */
:root {
  --bg: #f3f5f8;
  --surface: #ffffff;
  --sunk: #e9edf2;
  --line: #d7dde6;
  --fg: #141922;
  --muted: #5d6878;
  --ink: #1f3fbf;
  --ink-soft: #e3e9ff;
  --warn: #b45309;
  --warn-soft: #fdf0dc;
  --bad: #c0262d;
  --good: #1d7a46;
  --good-soft: #def3e6;
  --p-ang: #d4362b;
  --p-ebook: #2563c9;
  --p-ig: #b02a8f;
  --p-ecom: #2f8a4c;
  --f-display: "Familjen Grotesk", "Helvetica Neue", Arial, sans-serif;
  --f-body: "IBM Plex Sans", "Segoe UI", system-ui, sans-serif;
  --f-mono: "IBM Plex Mono", ui-monospace, Menlo, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0f1218; --surface: #171b23; --sunk: #1e2330; --line: #2b3240;
    --fg: #e8ecf3; --muted: #9aa5b6; --ink: #8fa6ff; --ink-soft: #222c4d;
    --warn: #f0a24a; --warn-soft: #3a2a14; --bad: #ff7a7a; --good: #5fcf8c; --good-soft: #163324;
    --p-ang: #ff6b5e; --p-ebook: #6aa0ff; --p-ig: #f070cf; --p-ecom: #62c584;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0f1218; --surface: #171b23; --sunk: #1e2330; --line: #2b3240;
  --fg: #e8ecf3; --muted: #9aa5b6; --ink: #8fa6ff; --ink-soft: #222c4d;
  --warn: #f0a24a; --warn-soft: #3a2a14; --bad: #ff7a7a; --good: #5fcf8c; --good-soft: #163324;
  --p-ang: #ff6b5e; --p-ebook: #6aa0ff; --p-ig: #f070cf; --p-ecom: #62c584;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html { padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); }
body {
  margin: 0;
  background: var(--bg); color: var(--fg);
  font: 15px/1.5 var(--f-body);
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 28px 64px;
}
.wrap { max-width: 980px; margin: 0 auto; display: flex; flex-direction: column; gap: 28px; }
h1, h2, h3 { font-family: var(--f-display); margin: 0; text-wrap: balance; letter-spacing: -0.01em; }
button, select, input, textarea { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--ink); outline-offset: 2px; }

header.top { display: flex; flex-wrap: wrap; align-items: flex-end; justify-content: space-between; gap: 16px; }
header.top h1 { font-size: 30px; line-height: 1.1; }
.today { font-family: var(--f-mono); font-size: 13px; color: var(--muted); margin-top: 6px; }
.tally { display: flex; gap: 18px; font-family: var(--f-mono); font-size: 13px; color: var(--muted); flex-wrap: wrap; }
.tally b { font-family: var(--f-display); font-size: 22px; color: var(--fg); display: block; line-height: 1; font-weight: 600; }

.controls { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.chip {
  border: 1px solid var(--line); background: var(--surface); border-radius: 999px;
  padding: 5px 12px; font-size: 13px; cursor: pointer;
}
.chip[aria-pressed="true"] { background: var(--fg); color: var(--bg); border-color: var(--fg); }
.controls .spacer { flex: 1; }
.controls label { font-size: 13px; color: var(--muted); display: flex; gap: 6px; align-items: center; cursor: pointer; }

/* Do-first strip */
.focus { background: var(--ink-soft); border-radius: 14px; padding: 18px 20px; display: flex; flex-direction: column; gap: 10px; }
.focus h2 { font-size: 18px; }
.focus .sub { font-size: 13px; color: var(--muted); margin-top: -6px; }
.focus ol { margin: 0; padding: 0; list-style: none; display: flex; flex-direction: column; gap: 6px; }
.focus li { display: grid; grid-template-columns: 22px 1fr auto; gap: 10px; align-items: baseline; }
.focus .n { font-family: var(--f-mono); font-size: 12px; color: var(--ink); }
.focus .t { min-width: 0; }
.focus .meta { font-size: 12px; color: var(--muted); white-space: nowrap; }
.focus .empty { color: var(--muted); font-size: 14px; }

/* Project bands */
.project { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; overflow: hidden; }
.phead { padding: 16px 20px 14px; display: grid; grid-template-columns: 1fr auto auto; gap: 4px 12px; border-top: 4px solid var(--pc); }
.toggle { border: 1px solid var(--line); background: var(--surface); border-radius: 999px; padding: 2px 10px; font-size: 12.5px; color: var(--muted); cursor: pointer; align-self: center; white-space: nowrap; }
.toggle:hover { color: var(--fg); border-color: var(--muted); }
.project.collapsed .phead { padding-bottom: 16px; }
.phead h2 { font-size: 21px; }
.phead .blurb { grid-column: 1 / -1; font-size: 13.5px; color: var(--muted); }
.rank { font-family: var(--f-mono); font-size: 11.5px; letter-spacing: 0.06em; text-transform: uppercase; color: var(--pc); align-self: center; white-space: nowrap; }
.bar { grid-column: 1 / -1; height: 6px; background: var(--sunk); border-radius: 3px; overflow: hidden; margin-top: 8px; }
.bar i { display: block; height: 100%; background: var(--pc); border-radius: 3px; transition: width .3s; }
.prog { grid-column: 1 / -1; font-family: var(--f-mono); font-size: 12px; color: var(--muted); }

.stream { border-top: 1px solid var(--line); }
.stream h3 { font-size: 12px; font-family: var(--f-mono); font-weight: 500; text-transform: uppercase; letter-spacing: 0.08em; color: var(--muted); padding: 12px 20px 4px; }
ul.tasks { list-style: none; margin: 0; padding: 0 0 6px; }
.task { border-top: 1px solid transparent; }
.row { display: grid; grid-template-columns: 22px 1fr auto; gap: 10px; align-items: start; padding: 7px 20px; }
.row:hover { background: var(--sunk); }
.check { appearance: none; width: 18px; height: 18px; border: 1.5px solid var(--muted); border-radius: 5px; margin: 2px 0 0; cursor: pointer; display: grid; place-items: center; background: var(--surface); }
.check:checked { background: var(--good); border-color: var(--good); }
.check:checked::after { content: ""; width: 9px; height: 5px; border: 2px solid var(--surface); border-top: 0; border-right: 0; transform: rotate(-45deg) translate(1px, -1px); }
.title { background: none; border: 0; padding: 0; text-align: left; cursor: pointer; min-width: 0; display: flex; flex-wrap: wrap; gap: 4px 8px; align-items: baseline; }
.title .txt { min-width: 0; }
.task.done .title .txt { text-decoration: line-through; color: var(--muted); }
.tags { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; justify-content: flex-end; }
.who { font-size: 11.5px; font-weight: 600; padding: 1px 8px; border-radius: 999px; background: var(--sunk); color: var(--muted); white-space: nowrap; }
.who.Zoe { background: var(--fg); color: var(--bg); }
.who.Claude { background: var(--ink-soft); color: var(--ink); }
.status { font-size: 11.5px; border-radius: 999px; padding: 1px 6px; border: 1px solid var(--line); background: var(--surface); cursor: pointer; }
.status.doing { border-color: var(--ink); color: var(--ink); }
.status.waiting { border-color: var(--warn); color: var(--warn); background: var(--warn-soft); }
.status.done { border-color: var(--good); color: var(--good); background: var(--good-soft); }
.due { font-family: var(--f-mono); font-size: 12px; color: var(--muted); white-space: nowrap; }
.due.today { color: var(--ink); font-weight: 500; }
.due.late { color: var(--bad); font-weight: 500; }
.p1 { font-family: var(--f-mono); font-size: 10.5px; font-weight: 500; color: var(--bad); letter-spacing: 0.05em; }

.detail { padding: 4px 20px 14px 52px; display: flex; flex-direction: column; gap: 10px; }
.detail textarea { width: 100%; min-height: 64px; resize: vertical; border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px; background: var(--bg); font-size: 14px; line-height: 1.45; }
.fields { display: flex; flex-wrap: wrap; gap: 10px 16px; align-items: center; font-size: 13px; color: var(--muted); }
.fields label { display: flex; gap: 6px; align-items: center; }
.fields select, .fields input { border: 1px solid var(--line); border-radius: 6px; padding: 3px 6px; background: var(--surface); font-size: 13px; color: var(--fg); }
.del { margin-left: auto; border: 0; background: none; color: var(--bad); font-size: 13px; cursor: pointer; padding: 2px 4px; }

.add { display: flex; gap: 8px; padding: 10px 20px 16px; border-top: 1px solid var(--line); flex-wrap: wrap; }
.add input { flex: 1; min-width: 0; border: 1px dashed var(--line); border-radius: 8px; padding: 7px 10px; background: transparent; font-size: 14px; }
.add input:focus { border-style: solid; }
.add button { border: 0; border-radius: 8px; background: var(--fg); color: var(--bg); padding: 7px 14px; font-size: 14px; cursor: pointer; }

.notice { background: var(--warn-soft); color: var(--warn); border-radius: 10px; padding: 10px 14px; font-size: 14px; }
.placeholder { color: var(--muted); font-size: 14px; padding: 12px 20px 18px; }
footer { font-size: 12.5px; color: var(--muted); }

@media (max-width: 560px) {
  header.top h1 { font-size: 25px; }
  .row { grid-template-columns: 22px 1fr; }
  .tags { grid-column: 2; justify-content: flex-start; }
  .detail { padding-left: 20px; }
  .focus li { grid-template-columns: 22px 1fr; }
  .focus .meta { grid-column: 2; }
}
@media (prefers-reduced-motion: reduce) { .bar i { transition: none; } }
</style>
</head>
<body>

<div class="wrap">
  <header class="top">
    <div>
      <h1>Zoe's Work Board</h1>
      <div class="today" id="today"></div>
    </div>
    <div class="tally" id="tally"></div>
  </header>

  <div class="controls" role="toolbar" aria-label="Filter tasks">
    <button class="chip" data-owner="all" aria-pressed="true">Everyone</button>
    <button class="chip" data-owner="Zoe" aria-pressed="false">Mine</button>
    <button class="chip" data-owner="Claude" aria-pressed="false">Claude's</button>
    <button class="chip" data-owner="waiting" aria-pressed="false">Waiting</button>
    <span class="spacer"></span>
    <label for="hideDone"><input type="checkbox" id="hideDone"> Hide done</label>
  </div>

  <div id="notice" class="notice" hidden></div>

  <section class="focus" aria-labelledby="focusH">
    <h2 id="focusH">Do first</h2>
    <div class="sub">Everything marked Monday-critical that isn't done yet. Taylor starts Mon 19 Oct.</div>
    <ol id="focusList"><li class="empty">Loading your tasks…</li></ol>
  </section>

  <div id="projects"></div>

  <footer>Tick a box or change a status and it saves straight away, on every device. Anyone with this link can see and edit the board.</footer>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script>
// Free Supabase project that stores the tasks. The publishable key is meant to be public.
const SUPABASE_URL = "";
const SUPABASE_KEY = "";
const PROJECTS = [
  { id: "ang",   name: "Ang Mo Ecom Huat",          rank: "Priority 1", color: "--p-ang",   blurb: "Taylor's viral-video recreations start Monday. Then editor coaching. EB course last." },
  { id: "ebook", name: "Ebook Viral-Hook Pipeline", rank: "Priority 2", color: "--p-ebook", blurb: "A viral video becomes the hook; the middle and CTA stay from our ebook storyline ads. You approve storylines, production runs on its own." },
  { id: "ig",    name: "IG Boom",                   rank: "Priority 2", color: "--p-ig",    blurb: "One topic in, 3 styles × 3 languages out, auto-posted. 18 videos a day at launch, sales videos first." },
  { id: "ecom",  name: "Personal Ecommerce",        rank: "Nice to have", color: "--p-ecom", blurb: "3 new TikTok accounts selling 3 hot products, with product videos Genjutsu'd into our own." }
];
const STATUSES = [["todo","To do"],["doing","Doing"],["waiting","Waiting"],["done","Done"]];
const OWNERS = ["Zoe","Claude","Taylor","Editors"];
const PRIOS = [["p1","Monday-critical"],["p2","High"],["p3","Normal"],["p4","Low"]];

let sb = null, tasks = [], loaded = false;
let ownerFilter = "all", hideDone = false;
const open = new Set();
let renderQueued = false;

let collapsed = new Set(["ecom"]);
try { hideDone = localStorage.getItem("hideDone") === "1"; } catch (e) {}
try { const c = localStorage.getItem("collapsed"); if (c !== null) collapsed = new Set(JSON.parse(c)); } catch (e) {}
function toggleProject(id) {
  collapsed.has(id) ? collapsed.delete(id) : collapsed.add(id);
  try { localStorage.setItem("collapsed", JSON.stringify([...collapsed])); } catch (e) {}
  render();
}
document.getElementById("hideDone").checked = hideDone;

const todayISO = (() => { const d = new Date(); return d.getFullYear() + "-" + String(d.getMonth()+1).padStart(2,"0") + "-" + String(d.getDate()).padStart(2,"0"); })();
document.getElementById("today").textContent = new Date().toLocaleDateString("en-GB", { weekday: "long", day: "numeric", month: "long", year: "numeric" });

function fmtDue(iso) {
  if (!iso) return "";
  const d = new Date(iso + "T00:00:00");
  return d.toLocaleDateString("en-GB", { weekday: "short", day: "numeric", month: "short" });
}
function dueClass(t) {
  if (!t.due || t.status === "done") return "";
  if (t.due < todayISO) return "late";
  if (t.due === todayISO) return "today";
  return "";
}
function el(tag, attrs, ...kids) {
  const n = document.createElement(tag);
  for (const k in (attrs || {})) {
    if (k === "class") n.className = attrs[k];
    else if (k === "text") n.textContent = attrs[k];
    else if (k.startsWith("on")) n.addEventListener(k.slice(2), attrs[k]);
    else if (attrs[k] !== false && attrs[k] != null) n.setAttribute(k, attrs[k] === true ? "" : attrs[k]);
  }
  for (const c of kids) if (c != null) n.append(c);
  return n;
}
function visible(t) {
  if (hideDone && t.status === "done") return false;
  if (ownerFilter === "waiting") return t.status === "waiting";
  if (ownerFilter !== "all") return t.owner === ownerFilter;
  return true;
}
function byOrder(a, b) { return (a.order ?? 0) - (b.order ?? 0); }

function showNotice(msg) { const n = document.getElementById("notice"); n.textContent = msg; n.hidden = !msg; }

async function save(id, patch) {
  const t = tasks.find(x => x.id === id);
  if (t) Object.assign(t, patch);
  queueRender();
  try {
    const { error } = await sb.from("tasks").update({ ...patch, updated_at: new Date().toISOString() }).eq("id", id);
    if (error) throw error;
    showNotice("");
  }
  catch (e) { showNotice("That change didn't save (" + (e && e.code || "error") + "). Reload the page and try again."); }
}

function renderTally() {
  const open_ = tasks.filter(t => t.status !== "done");
  const mine = open_.filter(t => t.owner === "Zoe").length;
  const claude = open_.filter(t => t.owner === "Claude").length;
  const done = tasks.length - open_.length;
  const box = document.getElementById("tally");
  box.replaceChildren(
    el("div", null, el("b", { text: String(mine) }), "on you"),
    el("div", null, el("b", { text: String(claude) }), "on Claude"),
    el("div", null, el("b", { text: done + "/" + tasks.length }), "done")
  );
}

function renderFocus() {
  const list = document.getElementById("focusList");
  if (!loaded) return;
  const order = Object.fromEntries(PROJECTS.map((p, i) => [p.id, i]));
  const items = tasks.filter(t => t.prio === "p1" && t.status !== "done")
    .sort((a, b) => (order[a.project] - order[b.project]) || byOrder(a, b));
  if (!items.length) { list.replaceChildren(el("li", { class: "empty", text: "Nothing Monday-critical left open. Next up: editor coaching." })); return; }
  list.replaceChildren(...items.map((t, i) => el("li", null,
    el("span", { class: "n", text: String(i + 1).padStart(2, "0") }),
    el("span", { class: "t", text: t.title }),
    el("span", { class: "meta", text: [t.owner, t.status === "waiting" ? "waiting" : "", fmtDue(t.due)].filter(Boolean).join(" · ") })
  )));
}

function taskNode(t) {
  const li = el("li", { class: "task" + (t.status === "done" ? " done" : "") });
  const check = el("input", { type: "checkbox", class: "check", id: "c-" + t.id, "aria-label": "Mark done: " + t.title, checked: t.status === "done",
    onchange: e => save(t.id, { status: e.target.checked ? "done" : "todo" }) });
  const title = el("button", { class: "title", "aria-expanded": String(open.has(t.id)),
    onclick: () => { open.has(t.id) ? open.delete(t.id) : open.add(t.id); render(); } },
    el("span", { class: "txt", text: t.title }),
    t.prio === "p1" && t.status !== "done" ? el("span", { class: "p1", text: "MON" }) : null);
  const status = el("select", { class: "status " + t.status, id: "s-" + t.id, "aria-label": "Status",
    onchange: e => save(t.id, { status: e.target.value }) },
    ...STATUSES.map(([v, l]) => el("option", { value: v, selected: v === t.status, text: l })));
  const tags = el("div", { class: "tags" },
    t.due ? el("span", { class: "due " + dueClass(t), text: fmtDue(t.due) }) : null,
    el("span", { class: "who " + t.owner, text: t.owner }),
    status);
  li.append(el("div", { class: "row" }, check, title, tags));

  if (open.has(t.id)) {
    const note = el("textarea", { id: "n-" + t.id, "aria-label": "Notes", placeholder: "Notes, links, what done looks like…" });
    note.value = t.note || "";
    note.addEventListener("change", () => save(t.id, { note: note.value }));
    note.addEventListener("blur", flushRender);
    const owner = el("select", { id: "o-" + t.id, onchange: e => save(t.id, { owner: e.target.value }) },
      ...OWNERS.map(o => el("option", { value: o, selected: o === t.owner, text: o })));
    const prio = el("select", { id: "p-" + t.id, onchange: e => save(t.id, { prio: e.target.value }) },
      ...PRIOS.map(([v, l]) => el("option", { value: v, selected: v === t.prio, text: l })));
    const due = el("input", { type: "date", id: "d-" + t.id, value: t.due || "", onchange: e => save(t.id, { due: e.target.value || null }) });
    let armed = false;
    const del = el("button", { class: "del", onclick: async e => {
      if (!armed) { armed = true; e.target.textContent = "Click again to delete"; setTimeout(() => { armed = false; e.target.textContent = "Delete"; }, 3000); return; }
      tasks = tasks.filter(x => x.id !== t.id); open.delete(t.id); render();
      const { error } = await sb.from("tasks").delete().eq("id", t.id);
      if (error) showNotice("Couldn't delete that task. Reload and try again.");
    }, text: "Delete" });
    li.append(el("div", { class: "detail" }, note,
      el("div", { class: "fields" },
        el("label", null, "Owner", owner),
        el("label", null, "Priority", prio),
        el("label", null, "Due", due),
        del)));
  }
  return li;
}

function renderProjects() {
  const root = document.getElementById("projects");
  root.style.display = "flex"; root.style.flexDirection = "column"; root.style.gap = "20px";
  root.replaceChildren(...PROJECTS.map(p => {
    const all = tasks.filter(t => t.project === p.id);
    const done = all.filter(t => t.status === "done").length;
    const pct = all.length ? Math.round(done / all.length * 100) : 0;
    const isCollapsed = collapsed.has(p.id);
    const sec = el("section", { class: "project" + (isCollapsed ? " collapsed" : ""), "aria-labelledby": "h-" + p.id });
    sec.style.setProperty("--pc", "var(" + p.color + ")");
    sec.append(el("div", { class: "phead" },
      el("h2", { id: "h-" + p.id, text: p.name }),
      el("span", { class: "rank", text: p.rank }),
      el("button", { class: "toggle", id: "t-" + p.id, "aria-expanded": String(!isCollapsed),
        onclick: () => toggleProject(p.id), text: isCollapsed ? "Show ▾" : "Hide ▴" }),
      el("div", { class: "blurb", text: p.blurb }),
      el("div", { class: "bar", role: "progressbar", "aria-valuenow": pct, "aria-valuemin": 0, "aria-valuemax": 100, "aria-label": p.name + " progress" }, (() => { const i = el("i"); i.style.width = pct + "%"; return i; })()),
      el("div", { class: "prog", text: loaded ? done + " of " + all.length + " done" : "" })));

    if (isCollapsed) return sec;
    if (!loaded) { sec.append(el("div", { class: "placeholder", text: "Tasks for this project appear here once the board loads." })); return sec; }

    const streams = [];
    for (const t of all.slice().sort(byOrder)) if (!streams.includes(t.stream || "Other")) streams.push(t.stream || "Other");
    let shown = 0;
    for (const s of streams) {
      const items = all.filter(t => (t.stream || "Other") === s && visible(t)).sort(byOrder);
      if (!items.length) continue;
      shown += items.length;
      sec.append(el("div", { class: "stream" }, el("h3", { text: s }), el("ul", { class: "tasks" }, ...items.map(taskNode))));
    }
    if (!shown) sec.append(el("div", { class: "placeholder", text: all.length ? "Nothing here matches this filter." : "No tasks yet. Add the first one below." }));

    const input = el("input", { id: "add-" + p.id, placeholder: "Add a task to " + p.name, "aria-label": "New task for " + p.name });
    const add = async () => {
      const title = input.value.trim(); if (!title || !sb) return;
      const last = all.slice().sort(byOrder).pop();
      const row = { project: p.id, stream: last ? last.stream : "General", title, note: "", owner: "Zoe", status: "todo", prio: "p3", due: null, ord: (last ? last.order : 0) + 1 };
      input.value = "";
      const { data, error } = await sb.from("tasks").insert(row).select();
      if (error) { showNotice("Couldn't add that task. Check your connection and try again."); input.value = title; return; }
      showNotice("");
      if (data && data[0] && !tasks.some(x => x.id === data[0].id)) { tasks.push(fromRow(data[0])); queueRender(); }
    };
    input.addEventListener("keydown", e => { if (e.key === "Enter") add(); });
    sec.append(el("div", { class: "add" }, input, el("button", { onclick: add, text: "Add" })));
    return sec;
  }));
}

function render() { renderTally(); renderFocus(); renderProjects(); }
function editing() { const a = document.activeElement; return a && (a.tagName === "TEXTAREA" || (a.tagName === "INPUT" && a.type === "text")); }
function queueRender() { if (editing()) { renderQueued = true; return; } render(); }
function flushRender() { setTimeout(() => { if (renderQueued && !editing()) { renderQueued = false; render(); } }, 0); }
document.addEventListener("focusout", flushRender);

document.querySelectorAll(".chip").forEach(c => c.addEventListener("click", () => {
  ownerFilter = c.dataset.owner;
  document.querySelectorAll(".chip").forEach(x => x.setAttribute("aria-pressed", String(x === c)));
  render();
}));
document.getElementById("hideDone").addEventListener("change", e => {
  hideDone = e.target.checked;
  try { localStorage.setItem("hideDone", hideDone ? "1" : "0"); } catch (err) {}
  render();
});

render();

function fromRow(r) { return { ...r, order: r.ord }; }

async function load() {
  const { data, error } = await sb.from("tasks").select("*");
  if (error) { showNotice("Couldn't load your tasks. Check your connection, then reload."); return; }
  tasks = data.map(fromRow);
  loaded = true;
  queueRender();
}

(async () => {
  if (!SUPABASE_URL || !window.supabase) {
    showNotice("The board isn't connected to its database yet.");
    document.getElementById("focusList").replaceChildren(el("li", { class: "empty", text: "Tasks appear here once the database is connected." }));
    return;
  }
  sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
  await load();
  // Live updates from other devices, with a slow refresh as a fallback.
  sb.channel("tasks").on("postgres_changes", { event: "*", schema: "public", table: "tasks" }, load).subscribe();
  setInterval(() => { if (!document.hidden) load(); }, 60000);
  document.addEventListener("visibilitychange", () => { if (!document.hidden) load(); });
})();
</script>

</html>
